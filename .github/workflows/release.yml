name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Never cancel a release in flight. GoReleaser and the npm publish job push
# side effects (Homebrew tap commit, npm registry version) that cannot be
# rolled back cleanly, so we queue rather than cancel. In practice two v*
# tags rarely race, but this is the safe default.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC support requires npm >=11.5.1. Pin the supported major rather than
      # relying on the runner or the bundled npm version.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd npm
          npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: cd npm && npm publish --access public
